<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b4c7e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <style>
      .node { fill:#f4f7fb; stroke:#2b4c7e; stroke-width:2; rx:10; }
      .box  { fill:#ffffff; stroke:#8a9bb5; stroke-width:1.2; rx:6; }
      .wal  { fill:#fff8e1; stroke:#c49a00; stroke-width:1.2; rx:6; }
      .title { font-weight:bold; font-size:17px; fill:#1b2a41; }
      .small { font-size:12px; fill:#3a4a5e; }
      .bus  { fill:#e3ecf8; stroke:#2b4c7e; stroke-width:1.5; rx:14; }
      .link { stroke:#2b4c7e; stroke-width:2; fill:none; }
      .st   { stroke:#2e7d32; stroke-width:2.5; fill:none; stroke-dasharray:7 5; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" class="title" font-size="20">JGroups replicated chat + key-value store</text>

  <!-- Group communication bus -->
  <rect class="bus" x="60" y="250" width="840" height="70"/>
  <text x="480" y="278" text-anchor="middle" class="title">JGroups cluster "ChatCluster" (TCP + TCPPING, SEQUENCER total order)</text>
  <text x="480" y="300" text-anchor="middle" class="small">group multicast: chat String messages and StoreCommand{id, key, value} operations; membership views (GMS, FD_SOCK2/FD_ALL3)</text>

  <!-- Node template: Virginia -->
  <g>
    <rect class="node" x="60" y="60" width="250" height="160"/>
    <text x="185" y="85" text-anchor="middle" class="title">Virginia (coordinator)</text>
    <rect class="box" x="80" y="100" width="210" height="44"/>
    <text x="185" y="118" text-anchor="middle">SimpleChat (console)</text>
    <text x="185" y="135" text-anchor="middle" class="small">/store  /state  chat</text>
    <rect class="box" x="80" y="155" width="100" height="50"/>
    <text x="130" y="176" text-anchor="middle">HashMap</text>
    <text x="130" y="193" text-anchor="middle" class="small">in memory</text>
    <rect class="wal" x="190" y="155" width="100" height="50"/>
    <text x="240" y="176" text-anchor="middle">Virginia.wal</text>
    <text x="240" y="193" text-anchor="middle" class="small">disk (fsync)</text>
  </g>

  <!-- London -->
  <g>
    <rect class="node" x="355" y="60" width="250" height="160"/>
    <text x="480" y="85" text-anchor="middle" class="title">London</text>
    <rect class="box" x="375" y="100" width="210" height="44"/>
    <text x="480" y="118" text-anchor="middle">SimpleChat (console)</text>
    <text x="480" y="135" text-anchor="middle" class="small">/store  /state  chat</text>
    <rect class="box" x="375" y="155" width="100" height="50"/>
    <text x="425" y="176" text-anchor="middle">HashMap</text>
    <text x="425" y="193" text-anchor="middle" class="small">in memory</text>
    <rect class="wal" x="485" y="155" width="100" height="50"/>
    <text x="535" y="176" text-anchor="middle">London.wal</text>
    <text x="535" y="193" text-anchor="middle" class="small">disk (fsync)</text>
  </g>

  <!-- Bogota (top) -->
  <g>
    <rect class="node" x="650" y="60" width="250" height="160"/>
    <text x="775" y="85" text-anchor="middle" class="title">Bogota</text>
    <rect class="box" x="670" y="100" width="210" height="44"/>
    <text x="775" y="118" text-anchor="middle">SimpleChat (console)</text>
    <text x="775" y="135" text-anchor="middle" class="small">/store  /state  chat</text>
    <rect class="box" x="670" y="155" width="100" height="50"/>
    <text x="720" y="176" text-anchor="middle">HashMap</text>
    <text x="720" y="193" text-anchor="middle" class="small">in memory</text>
    <rect class="wal" x="780" y="155" width="100" height="50"/>
    <text x="830" y="176" text-anchor="middle">Bogota.wal</text>
    <text x="830" y="193" text-anchor="middle" class="small">disk (fsync)</text>
  </g>

  <!-- links nodes <-> bus -->
  <line class="link" x1="185" y1="220" x2="185" y2="250" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="link" x1="480" y1="220" x2="480" y2="250" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="link" x1="775" y1="220" x2="775" y2="250" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- New / recovered node -->
  <g>
    <rect class="node" x="560" y="400" width="340" height="170" style="stroke:#2e7d32; stroke-dasharray:6 4"/>
    <text x="730" y="425" text-anchor="middle" class="title">New / recovered node (Bogota restarted)</text>
    <text x="580" y="455" class="small">1. Replay Bogota.wal  →  rebuild HashMap (before joining)</text>
    <text x="580" y="478" class="small">2. channel.connect("ChatCluster")  →  new view</text>
    <text x="580" y="501" class="small">3. channel.getState()  →  coordinator's getState()</text>
    <text x="580" y="524" class="small">4. setState(): history + ops; apply only unseen op ids</text>
    <text x="580" y="547" class="small">    (append to WAL + fsync, then HashMap)</text>
  </g>
  <line class="link" x1="730" y1="320" x2="730" y2="400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- State transfer arrow from coordinator -->
  <path class="st" d="M110,232 C 60,420 300,520 556,500" marker-end="url(#arrowG)"/>
  <text x="200" y="380" fill="#2e7d32" font-weight="bold">state transfer (STATE_TRANSFER)</text>
  <text x="200" y="400" class="small">coordinator sends chat history + applied StoreCommands</text>

  <!-- write path legend -->
  <rect class="box" x="60" y="520" width="440" height="58"/>
  <text x="75" y="542" class="small"><tspan font-weight="bold">Write path on every node, for each delivered StoreCommand:</tspan></text>
  <text x="75" y="563" class="small">id already applied? → ignore.  Else: append to WAL → fsync → HashMap.put</text>
</svg>
